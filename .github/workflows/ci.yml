name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checkout deliberately does NOT fetch the private submodule, so every run
# also proves what a foreign clone gets: the build has to come through on the
# demo fallback rather than fail on missing content.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - name: Colour regression test of the image pipeline
        run: pnpm test:integration

      - run: pnpm typecheck

      - name: Render the image variants
        run: pnpm build-images --strict

      - name: Check the generated manifest
        run: pnpm check-manifest --expect-mode demo --min-photos 3

      - run: pnpm generate

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public
          retention-days: 7
